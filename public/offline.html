<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ef" />
    <title>You’re offline — mini-habitify</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f7f5ef;
        color: #2b352c;
        font:
          16px/1.6 system-ui,
          sans-serif;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      main {
        max-width: 420px;
        width: 100%;
      }
      small {
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      h1 {
        font:
          500 42px/1.1 Georgia,
          serif;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 10px 20px;
        margin-top: 16px;
        background: #3d6043;
        color: #fff;
        border-radius: 10px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #3d6043;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <small>mini-habitify</small>
      <h1>You’re offline.</h1>
      <p>
        Your activity is saved online. Reconnect to view your trackers or record
        a check-in.
      </p>
      <p>
        This screen doesn’t store your private activity data, and no changes are
        queued.
      </p>
      <a href="/today">Try again</a>
    </main>
  </body>
</html>
