name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      PLAYWRIGHT_PORT: 3000
      PLAYWRIGHT_USE_PRODUCTION: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Start disposable local Supabase
        run: npx supabase start
      - name: Configure local test environment
        shell: bash
        run: |
          npx supabase status --output json | node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const status = JSON.parse(readFileSync(0, "utf8"));
            const key = status.PUBLISHABLE_KEY || status.ANON_KEY;
            if (!status.API_URL || !key) throw new Error("Local Supabase configuration is incomplete");
            writeFileSync(".env.local", [
              `NEXT_PUBLIC_SUPABASE_URL=${status.API_URL}`,
              `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${key}`,
              "NEXT_PUBLIC_APP_URL=http://localhost:3000",
              "",
            ].join("\n"), { mode: 0o600 });
          '
      - run: npm run test:security
      - run: npm run test:migrations
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - name: Stop disposable local Supabase
        if: always()
        run: npx supabase stop
